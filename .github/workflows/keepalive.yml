name: Supabase keep-alive
on:
  schedule:
    - cron: "0 8 */3 * *"
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Instalar cliente de PostgreSQL
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Conectar y hacer una consulta real
        run: psql "${{ secrets.SUPABASE_DB_URL }}" -c "update configuracion set updated_at = now() where clave = 'keepalive_ping';"
