name: Supabase keep-alive
on:
  schedule:
    - cron: "0 8 */3 * *"
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - run: |
          curl -sf -o /dev/null \
            "${{ secrets.SUPABASE_URL }}/rest/v1/usuarios?select=id&limit=1" \
            -H "apikey: ${{ secrets.SUPABASE_KEY }}"
